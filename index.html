<!DOCTYPE html>
<html>

<head>
  <title>My Notes Website</title>

  <style>

    body{
      font-family: Arial;
      background:#f5f5f5;
      padding:40px;
    }

    .card{
      background:white;
      max-width:800px;
      margin:auto;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      color:#333;
    }

    .notes-list{
      margin-top:30px;
    }

    .notes-list a{
      display:block;
      text-decoration:none;
      margin-bottom:15px;
    }

    button{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#333;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      opacity:0.9;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>📘 My Notes Website</h1>

    <p>Welcome to my free notes website hosted using GitHub Pages.</p>

    <div class="notes-list">

      <h2>Biology Notes</h2>

      <a href="notes/Cell.pdf" target="_blank">
        <button>📄 Cell Notes</button>
      </a>

      <a href="notes/Tissues.pdf" target="_blank">
        <button>📄 Tissues Notes</button>
      </a>

      <a href="notes/Heredity.pdf" target="_blank">
        <button>📄 Heredity Notes</button>
      </a>

    </div>

  </div>

</body>

</html>
